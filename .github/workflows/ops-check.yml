name: ops-check
on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 KST
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEEHAYONI_TOKEN: ${{ secrets.LEEHAYONI_TOKEN }}
          ARKLY_TOKEN: ${{ secrets.ARKLY_TOKEN }}
      - name: 상태 파일 커밋
        run: |
          git config user.name "ops-bot"
          git config user.email "ops-bot@users.noreply.github.com"
          git add status.json STATUS.md
          git diff --cached --quiet || git commit -m "ops: 상태 갱신 $(date -u +%F)"
          git push
